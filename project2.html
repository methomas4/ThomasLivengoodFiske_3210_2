<html>
<head>
    <title>Exploration of the Cheese Planet</title>
</head>
<body>
    
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">

const scene = new THREE.Scene();
const orbitalCamera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
orbitalCamera.position.set(0, -150, 100);
orbitalCamera.lookAt(new THREE.Vector3(0, 50, 0));
scene.add(orbitalCamera);

//Define a light source
const light = new THREE.DirectionalLight(0xffffff, 1.0);
light.position.set(10,20,10);
scene.add(light);

//Define Planar Mesh
const planarGeometry = new THREE.PlaneGeometry(100, 100, 128, 128);

const seed = Math.random() * 1000;
const vertexShader  = `
uniform float uSeed;
uniform vec3 uPoint;
uniform float uScale;
uniform float uArea;

varying float dist;

float random(vec2 st) {
    return fract(sin(dot(st.xy, vec2(10.0, 80.0)) * uSeed) * 43758.5453123); 
}
    void main() {
        vec3 newPosition = position;
        float zOffset = random(position.xy) * 10.0;
        newPosition.z += zOffset;

        vec4 vertexPosition = modelMatrix * vec4(position, 1.0);

        dist = distance(vertexPosition.xy, uPoint.xy);
        vec3 vertexNew = position;
        if(dist < uArea){
        newPosition += normal * uScale;
        };

        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
    }
`;

const fragmentShader = `
  uniform float uArea;
  uniform vec3 uHighlight;
  varying float dist;  
    

  void main() {

    vec3 meshColor = vec3(0.5, 0.7, 1.0);
    float highlight = dist < uArea ? 1.0 : 0.0;
    vec3 color = mix(meshColor, uHighlight, highlight);
    gl_FragColor = vec4(color, 1.0);
  }
`;

const planarMaterial = new THREE.ShaderMaterial({
    uniforms: {
        uSeed: { value: seed },
        uPoint: { value: new THREE.Vector3(0, 0, 0)},
        uArea: { value: 5},
        uScale: { value: 20},
        uHighlight: {value: new THREE.Color(0xffc857)}
    },
    vertexShader: vertexShader,
    fragmentShader: fragmentShader,
    side: THREE.DoubleSide
});

const planarMesh = new THREE.Mesh(planarGeometry, planarMaterial);
//planarMesh.rotation.x = -Math.PI / 2;
scene.add(planarMesh);

//Camera Movement

var wDown = false;
var sDown = false;
var aDown = false;
var dDown = false;

window.addEventListener('keydown', (event) => {
    switch (event.code) {
        case 'KeyW':
            wDown = true;
            break;
        case 'KeyS':
            sDown = true;
            break;
        case 'KeyA':
            aDown = true;
            break;
        case 'KeyD':
            dDown = true;
            break;
    }   
});

window.addEventListener('keyup', (event) => {
    switch (event.code) {
        case 'KeyW':
            wDown = false;
            break;
        case 'KeyS':
            sDown = false;
            break;
        case 'KeyA':
            aDown = false;
            break;
        case 'KeyD':
            dDown = false;            
            break;
    }   
});

function createSolarPanel(a,b,c){
    const newPanel = new Float32Array([
        a+0.5, b+0.5, c+0.5, //Top point one (bottom left on top side)
        a+0.5, b+0.5, c-0.5, //Top point two (top left on top side)
        a-0.5, b+0.5, c+0.5, //Top point three (bottom right on top side)
        a-0.5, b+0.5, c-0.5,//Top point four (top right on top side)
        a+0.5, b-1.5, c-0.5,//Bottom point one (top left on bottom side)
        a+0.5, b-1.5, c+0.5,//Bottom point two (bottom left on bottom side)
        a-0.5, b-1.5, c+0.5,//Bottom point three (bottom right on bottom side)
        a-0.5, b-1.5, c-0.5 //Bottom point four (top right on bottom side)
        ]);

        const panelIndices = [
            // Top face
            0, 1, 2,   2, 1, 3,
            // Bottom face
            4, 5, 7,   7, 5, 6,
            // Front face
            5, 0, 6,   6, 0, 2,
            // Back face
            1, 4, 3,   3, 4, 7,
            // Right face (Positive X)
            0, 5, 1,   1, 5, 4,
            // Left face (Negative X)
            6, 2, 7,   7, 2, 3
        ];
        const panelGeometry = new THREE.BufferGeometry();
        panelGeometry.setIndex(panelIndices);
        panelGeometry.setAttribute('position', new THREE.BufferAttribute(newPanel, 3));

        const panelMaterial = new THREE.MeshBasicMaterial({
            color: 0x808080, //gray
            wireframe: false,
            side: THREE.DoubleSide
        });

        const panelMesh = new THREE.Mesh(panelGeometry, panelMaterial);
        return panelMesh;
}

function createSateliteBody(){
    const sateliteGeometry = new THREE.CylinderGeometry(1,1,5,64); //(top radius, bottom radius, height, number of radial segments)
    const sateliteMaterial = new THREE.MeshBasicMaterial({
            color: 0xfaf9f6, //off-white
            wireframe: false,
            side: THREE.DoubleSide
        });
    const sateliteBodyMesh = new THREE.Mesh(sateliteGeometry, sateliteMaterial);
    return sateliteBodyMesh;
}

let currCamera = orbitalCamera;

function switchCamera(){
    const surfaceCamera = new THREE.OrthographicCamera(
  -50,50, //left, right
  50, -50, //up, down
  0.1, 1000 //near plane, far plane
);

surfaceCamera.position.set(0, 300, 300);
surfaceCamera.lookAt(new THREE.Vector3(0, 0, 0));
window.addEventListener('keydown', (event) => {
    switch(event.key.toLowerCase()){
      case 't':
        if(currCamera == orbitalCamera){
            currCamera = surfaceCamera;
        }else{
            currCamera = orbitalCamera;
        }
        console.log("camera switched");
        break;
    }
})
}

const satelite = new THREE.Group();
const sateliteBody = createSateliteBody();
const leftSolarPanel = createSolarPanel(3.7,25,0);
const rightSolarPanel = createSolarPanel(6.3,25,0);
const satelitePosition = new THREE.Vector3();

sateliteBody.position.x = 5;
sateliteBody.position.y = 25;

satelite.add(sateliteBody);
satelite.add(leftSolarPanel);
satelite.add(rightSolarPanel);

//scene.add(satelite);
const sateliteOrbit = new THREE.Group();
sateliteOrbit.add(satelite);
sateliteOrbit.position.x += 100;
//sateliteOrbit.position.z += 20;
sateliteOrbit.position.y += -40;
scene.add(sateliteOrbit);


const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// 5. Render the Frame

const clock = new THREE.Clock(true);
const orbitRadius = 40;
let launchAngle = 0;
function animate() {
  requestAnimationFrame(animate);




  sateliteOrbit.updateMatrixWorld(true);
  //sateliteBody.getWorldPosition(sateliteWorldPosition);
  sateliteBody.getWorldPosition(satelitePosition);
  planarMaterial.uniforms.uPoint.value.copy(satelitePosition);
  const deltaTime = clock.getDelta();
  launchAngle += 0.5 * deltaTime; //Speed of rotation
  sateliteOrbit.position.x = Math.cos(launchAngle) * orbitRadius; //X-position follows a cosine wave * 80 to rotate the iss about the planet
  sateliteOrbit.position.z = Math.sin(launchAngle) * orbitRadius; //Z-position follows a sine wave * 80 to rotate the iss about the planet
  

  switchCamera();
  renderer.render(scene, currCamera);
  if (wDown == true) {
    orbitalCamera.position.z -= 0.2;
  }
  if (sDown == true) {
    orbitalCamera.position.z += 0.2;
  }
  if (aDown == true) {
    orbitalCamera.position.x -= 0.2;
  }
  if (dDown == true) {
    orbitalCamera.position.x += 0.2;
  }
}
animate();

    </script>
</body>
</html>
