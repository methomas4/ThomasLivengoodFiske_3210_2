<html>
<head>
    <title>Three.js Framework Example</title>
</head>
<body>
    
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">
//Multiply the object's X coordinate by 2.5 then move it a flat amount of 1.4
//Multiply the object's Y coordinate by 2.0 then move it a flat amount of 0.5
//Multiply the object's Z coordinate by 1.5 then move it a flat amount of 0.6

// 1. Initialize the Scene
const scene = new THREE.Scene();

// 2. Configure the Camera (Perspective Projection)
// Arguments: Field of View (deg), Aspect Ratio, Near Clipping Plane, Far Clipping Plane
const camera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
camera.position.set(0, 50, 0); // Position the camera along the +Z axis
camera.lookAt(new THREE.Vector3(0, 0, 0));
scene.add(camera);

// 3. Define Planar Mesh
const planarGeometry = new THREE.PlaneGeometry(100, 100, 128, 128);
const planarMaterial = new THREE.MeshStandardMaterial({
    color: 0xfcba03,
    emissive: 0xffffff,
    emissiveIntensity: 0.3
});
const planarMesh = new THREE.Mesh(planarGeometry, planarMaterial);
planarMesh.rotation.x = -Math.PI / 2;
const positionAttribute = planarGeometry.attributes.position;
const positions = positionAttribute.array();
for (let i = 2; i < positions.length; i+=3) {
    if (!isNaN(positions[i])) {
        positions[i] += Math.random();
    }
}
positionAttribute.needsUpdate = true;
planarGeometry.computeVertexNormals();
scene.add(planarMesh);



const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// 5. Render the Frame
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

    </script>
</body>
</html>
