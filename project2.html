<html>
<head>
    <title>Three.js Framework Example</title>
</head>
<body>
    
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">

const scene = new THREE.Scene();
const orbitalCamera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
orbitalCamera.position.set(0, 50, 0);
orbitalCamera.lookAt(new THREE.Vector3(0, 0, 0));
scene.add(orbitalCamera);

//Define a light source
const light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(10,20,10);
scene.add(light);

//Define Planar Mesh
const planarGeometry = new THREE.PlaneGeometry(100, 100, 128, 128);
const planarMaterial = new THREE.MeshStandardMaterial({
    color: 0xc9c73e,
});
const planarMesh = new THREE.Mesh(planarGeometry, planarMaterial);
planarMesh.rotation.x = -Math.PI / 2;
const positionAttribute = planarGeometry.attributes.position;
const positions = positionAttribute.array;
for (let i = 2; i < positions.length; i+=3) {
    if (!isNaN(positions[i])) {
        positions[i] += Math.random();
    }
}
positionAttribute.needsUpdate = true;
planarGeometry.computeVertexNormals();
scene.add(planarMesh);

//Camera Movement

var wDown = false;
var sDown = false;
var aDown = false;
var dDown = false;

window.addEventListener('keydown', (event) => {
    switch (event.code) {
        case 'KeyW':
            wDown = true;
            break;
        case 'KeyS':
            sDown = true;
            break;
        case 'KeyA':
            aDown = true;
            break;
        case 'KeyD':
            dDown = true;
            break;
    }   
});

window.addEventListener('keyup', (event) => {
    switch (event.code) {
        case 'KeyW':
            wDown = false;
            break;
        case 'KeyS':
            sDown = false;
            break;
        case 'KeyA':
            aDown = false;
            break;
        case 'KeyD':
            dDown = false;            
            break;
    }   
});

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// 5. Render the Frame
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, orbitalCamera);
  if (wDown == true) {
    orbitalCamera.position.z -= 0.2;
  }
  if (sDown == true) {
    orbitalCamera.position.z += 0.2;
  }
  if (aDown == true) {
    orbitalCamera.position.x -= 0.2;
  }
  if (dDown == true) {
    orbitalCamera.position.x += 0.2;
  }
}
animate();

    </script>
</body>
</html>
