<html>
<head>
    <title>Exploration of the Cheese Planet</title>
</head>
<body>
    
  <!-- Three.js Dependencies -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';


const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias: true });
const orbitalCamera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
orbitalCamera.position.set(0, 0, 250); // Camera controls
orbitalCamera.lookAt(new THREE.Vector3(0, 0, 0));
const controls = new PointerLockControls(
    orbitalCamera,
    renderer.domElement
);
controls.pointerSpeed = 0.5; // sensitivity
document.body.addEventListener('click', () => {
    controls.lock();
});
scene.add(orbitalCamera);

//Define a light source
const light = new THREE.DirectionalLight(0xffffff, 1.0);
light.position.set(10,20,10);
scene.add(light);

//Define Planar Mesh
const planarGeometry = new THREE.PlaneGeometry(100, 100, 128, 128);

const seed = Math.random() * 1000;
const vertexShader  = `
uniform float uSeed;
uniform vec3 uPoint;
uniform float uScale;
uniform float uArea;

varying float dist;

float random(vec2 st) {
    return fract(sin(dot(st.xy, vec2(10.0, 80.0)) * uSeed) * 40000.0); 
}
    void main() {
        vec3 newPosition = position;
        float zOffset = random(position.xy) * 10.0;
        newPosition.z += zOffset;

        vec4 vertexPosition = modelMatrix * vec4(position, 1.0);

        dist = distance(vertexPosition.xz, uPoint.xz);
        if(dist < uArea){
        float direction = uPoint.z >= vertexPosition.z ? 1.0 : -1.0;
        newPosition += normal * uScale * direction;
        };

        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
    }
`;

const fragmentShader = `
  uniform float uArea;
  uniform vec3 uHighlight;
  varying float dist;  
    

  void main() {

    vec3 meshColor = vec3(0.5, 0.7, 1.0);
    float highlight = dist < uArea ? 1.0 : 0.0;
    vec3 color = mix(meshColor, uHighlight, highlight);
    gl_FragColor = vec4(color, 1.0);
  }
`;

const planarMaterial = new THREE.ShaderMaterial({
    uniforms: {
        uSeed: { value: seed },
        uPoint: { value: new THREE.Vector3(0, 0, 0)},
        uArea: { value: 5},
        uScale: { value: 5},
        uHighlight: {value: new THREE.Color(0xffc857)}
    },
    vertexShader: vertexShader,
    fragmentShader: fragmentShader,
    side: THREE.DoubleSide,
    wireframe: false
});

const planarMesh = new THREE.Mesh(planarGeometry, planarMaterial);
planarMesh.rotation.x = -Math.PI / 2;
scene.add(planarMesh);

//Camera Movement

var wDown = false;
var sDown = false;
var aDown = false;
var dDown = false;
var spaceDown = false;
var ctrlDown = false;

window.addEventListener('keydown', (event) => {
    switch (event.code) {
        case 'KeyW':
            wDown = true;
            break;
        case 'KeyS':
            sDown = true;
            break;
        case 'KeyA':
            aDown = true;
            break;
        case 'KeyD':
            dDown = true;
            break;
        case 'Space':
            spaceDown = true;
            break;
        case 'ControlLeft':
            ctrlDown = true;
            break;
    }   
});

window.addEventListener('keyup', (event) => {
    switch (event.code) {
        case 'KeyW':
            wDown = false;
            break;
        case 'KeyS':
            sDown = false;
            break;
        case 'KeyA':
            aDown = false;
            break;
        case 'KeyD':
            dDown = false;            
            break;
        case 'Space':
            spaceDown = false;
            break;
        case 'ControlLeft':
            ctrlDown = false;
            break;
    }   
});

function createSolarPanel(){
    const newPanel = new Float32Array([
        0.5, 0.5, 0.5, //Top point one (bottom left on top side)
        0.5, 0.5, -0.5, //Top point two (top left on top side)
        -0.5, 0.5, 0.5, //Top point three (bottom right on top side)
        -0.5, 0.5, -0.5,//Top point four (top right on top side)
        0.5, -1.5, -0.5,//Bottom point one (top left on bottom side)
        0.5, -1.5, 0.5,//Bottom point two (bottom left on bottom side)
        -0.5, -1.5, 0.5,//Bottom point three (bottom right on bottom side)
        -0.5, -1.5, -0.5 //Bottom point four (top right on bottom side)
        ]);

        const panelIndices = [
            // Top face
            0, 1, 2,   2, 1, 3,
            // Bottom face
            4, 5, 7,   7, 5, 6,
            // Front face
            5, 0, 6,   6, 0, 2,
            // Back face
            1, 4, 3,   3, 4, 7,
            // Right face (Positive X)
            0, 5, 1,   1, 5, 4,
            // Left face (Negative X)
            6, 2, 7,   7, 2, 3
        ];
        const panelGeometry = new THREE.BufferGeometry();
        panelGeometry.setIndex(panelIndices);
        panelGeometry.setAttribute('position', new THREE.BufferAttribute(newPanel, 3));

        const panelMaterial = new THREE.MeshBasicMaterial({
            color: 0x808080, //gray
            wireframe: false,
            side: THREE.DoubleSide
        });

        const panelMesh = new THREE.Mesh(panelGeometry, panelMaterial);
        return panelMesh;
}

function createSateliteBody(){
    const sateliteGeometry = new THREE.CylinderGeometry(1,1,5,64); //(top radius, bottom radius, height, number of radial segments)
    const sateliteMaterial = new THREE.MeshBasicMaterial({
            color: 0xfaf9f6, //off-white
            wireframe: false,
            side: THREE.DoubleSide
        });
    const sateliteBodyMesh = new THREE.Mesh(sateliteGeometry, sateliteMaterial);
    return sateliteBodyMesh;
}


let currCamera = orbitalCamera;

function switchCamera(){
    const surfaceCamera = new THREE.OrthographicCamera(
  -50,50, //left, right
  50, -50, //up, down
  0.1, 1000 //near plane, far plane
);

surfaceCamera.position.set(0, 300, 0);
surfaceCamera.up.set(0, 0, -1);
surfaceCamera.lookAt(new THREE.Vector3(0, 0, 0));
window.addEventListener('keydown', (event) => {
    switch(event.key.toLowerCase()){
      case 't':
        if(currCamera == orbitalCamera){
            currCamera = surfaceCamera;
            planarMaterial.wireframe = true;
            controls.unlock();
        }else{
            currCamera = orbitalCamera;
            planarMaterial.wireframe = false;
            controls.lock();
        }
        break;
    }
})
}

const satelite = new THREE.Group();
const sateliteBody = createSateliteBody();
const leftSolarPanel = createSolarPanel(3.7,25,0);
const rightSolarPanel = createSolarPanel(6.3,25,0);

leftSolarPanel.position.x = 3.7;
leftSolarPanel.position.y = 25;

rightSolarPanel.position.y = 25;
rightSolarPanel.position.x = 6.3;

sateliteBody.position.x = 5;
sateliteBody.position.y = 25;
sateliteBody.rotation.y += 45;

satelite.add(sateliteBody);
satelite.add(leftSolarPanel);
satelite.add(rightSolarPanel);
satelite.scale.set(1.5,1.5,1.5);

satelite.position.y -= 45;
const moonLoader = new GLTFLoader();
const moonDRACOLoader = new DRACOLoader();

moonDRACOLoader.setDecoderPath( 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
moonLoader.setDRACOLoader(moonDRACOLoader);
const moonData = await moonLoader.loadAsync( './base_basic_shaded.glb' );
const moon = moonData.scene;
moon.position.set(60,60, 20);
moon.scale.set(7,7,7);
scene.add(moon);

const sateliteOrbit = new THREE.Group();
sateliteOrbit.add(satelite);
sateliteOrbit.position.x += 100;
sateliteOrbit.position.y += 40;
scene.add(sateliteOrbit);


renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock(true);
const orbitRadius = 80;
let launchAngle = 0;


switchCamera();
// 5. Render the Frame
function animate() {
  requestAnimationFrame(animate);

  const satelitePosition = new THREE.Vector3();

  sateliteOrbit.updateMatrixWorld(true);
  sateliteOrbit.getWorldPosition(satelitePosition);
  planarMaterial.uniforms.uPoint.value.copy(satelitePosition);


  const deltaTime = clock.getDelta();
  leftSolarPanel.rotation.x += 1 * deltaTime;
  rightSolarPanel.rotation.x += 1 * deltaTime;
  // leftSolarPanel.rotation.z += 1 * deltaTime;
  // rightSolarPanel.rotation.z += 1 * deltaTime;
  moon.rotation.y += 0.01;
  moon.rotation.x += 0.01;
  launchAngle += 0.5 * deltaTime;

sateliteOrbit.position.x =
    Math.cos(launchAngle) * orbitRadius;

sateliteOrbit.position.y =
    Math.sin(launchAngle) * orbitRadius;

sateliteOrbit.position.z = 0;
  renderer.render(scene, currCamera);

 
  if (wDown == true) {
    controls.moveForward(25 * deltaTime);
  }
  if (sDown == true) {
    controls.moveForward(-25 * deltaTime);
  }
  if (aDown == true) {
    controls.moveRight(-25 * deltaTime)
  }
  if (dDown == true) {
    controls.moveRight(25 * deltaTime)
  }
  if (spaceDown == true) {
    orbitalCamera.position.y += 25 * deltaTime;
  }
  if (ctrlDown == true) {
    orbitalCamera.position.y -= 25 * deltaTime;
  }
}
animate();

    </script>
</body>
</html>
