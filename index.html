<html>
<head>
    <title>Exploration of the Cheese Planet</title>
</head>
<body>
    
  <!-- Three.js Dependencies -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';


const scene = new THREE.Scene();
const orbitalCamera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
orbitalCamera.position.set(0, 0, 250);
orbitalCamera.lookAt(new THREE.Vector3(0, 0, 0));
scene.add(orbitalCamera);

//Define a light source
const light = new THREE.DirectionalLight(0xffffff, 1.0);
light.position.set(10,20,10);
scene.add(light);

//Define Planar Mesh
const planarGeometry = new THREE.PlaneGeometry(100, 100, 128, 128);

const seed = Math.random() * 1000;
const vertexShader  = `
uniform float uSeed;
uniform vec3 uPoint;
uniform float uScale;
uniform float uArea;

varying float dist;

float random(vec2 st) {
    return fract(sin(dot(st.xy, vec2(10.0, 80.0)) * uSeed) * 43758.5453123); 
}
    void main() {
        vec3 newPosition = position;
        float zOffset = random(position.xy) * 10.0;
        newPosition.z += zOffset;

        vec4 vertexPosition = modelMatrix * vec4(position, 1.0);

        dist = distance(vertexPosition.xz, uPoint.xz);
        if(dist < uArea){
        float direction = uPoint.z >= vertexPosition.z ? 1.0 : -1.0;
        newPosition += normal * uScale * direction;
        };

        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
    }
`;

const fragmentShader = `
  uniform float uArea;
  uniform vec3 uHighlight;
  varying float dist;  
    

  void main() {

    vec3 meshColor = vec3(0.5, 0.7, 1.0);
    float highlight = dist < uArea ? 1.0 : 0.0;
    vec3 color = mix(meshColor, uHighlight, highlight);
    gl_FragColor = vec4(color, 1.0);
  }
`;

const planarMaterial = new THREE.ShaderMaterial({
    uniforms: {
        uSeed: { value: seed },
        uPoint: { value: new THREE.Vector3(0, 0, 0)},
        uArea: { value: 5},
        uScale: { value: 5},
        uHighlight: {value: new THREE.Color(0xffc857)}
    },
    vertexShader: vertexShader,
    fragmentShader: fragmentShader,
    side: THREE.DoubleSide
});

const planarMesh = new THREE.Mesh(planarGeometry, planarMaterial);
planarMesh.rotation.x = -Math.PI / 2;
scene.add(planarMesh);

//Camera Movement

var wDown = false;
var sDown = false;
var aDown = false;
var dDown = false;
let leftDown = false;
let rightDown = false;
let upDown = false;
let downDown = false;

window.addEventListener('keydown', (event) => {
    switch (event.code) {
        case 'KeyW':
            wDown = true;
            break;
        case 'KeyS':
            sDown = true;
            break;
        case 'KeyA':
            aDown = true;
            break;
        case 'KeyD':
            dDown = true;
            break;
        case 'ArrowLeft':
            leftDown = true;
            break;
        case 'ArrowRight':
            rightDown = true;
            break;
        case 'ArrowUp':
            upDown = true;
            break;
        case 'ArrowDown':
            downDown = true;
            break;
    }   
});

window.addEventListener('keyup', (event) => {
    switch (event.code) {
        case 'KeyW':
            wDown = false;
            break;
        case 'KeyS':
            sDown = false;
            break;
        case 'KeyA':
            aDown = false;
            break;
        case 'KeyD':
            dDown = false;            
            break;
        case 'ArrowLeft':
            leftDown = false;
            break;
        case 'ArrowRight':
            rightDown = false;
            break;
        case 'ArrowUp':
            upDown = false;
            break;
        case 'ArrowDown':
            downDown = false;
            break;
    }   
});


let currCamera = orbitalCamera;

function switchCamera(){
    const surfaceCamera = new THREE.OrthographicCamera(
  -50,50, //left, right
  50, -50, //up, down
  0.1, 1000 //near plane, far plane
);

surfaceCamera.position.set(0, 0, 300);
surfaceCamera.lookAt(new THREE.Vector3(0, 0, 0));
window.addEventListener('keydown', (event) => {
    switch(event.key.toLowerCase()){
      case 't':
        if(currCamera == orbitalCamera){
            currCamera = surfaceCamera;
        }else{
            currCamera = orbitalCamera;
        }
        break;
    }
})
}

const satelite = new THREE.Group();

const sateliteLoader = new GLTFLoader();
const sateliteDRACOLoader = new DRACOLoader();

sateliteDRACOLoader.setDecoderPath( 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
sateliteLoader.setDRACOLoader(sateliteDRACOLoader);
const sateliteData = await sateliteLoader.loadAsync( './ISS_stationary.glb' );
const issModel = sateliteData.scene;
issModel.scale.set(0.25,0.25,0.25);
satelite.add(issModel);

const sateliteOrbit = new THREE.Group();
sateliteOrbit.add(satelite);
sateliteOrbit.position.x += 100;
sateliteOrbit.position.y += 40;
scene.add(sateliteOrbit);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock(true);
const orbitRadius = 80;
let launchAngle = 0;


switchCamera();
// 5. Render the Frame
var direction = new THREE.Vector3();
var right = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);

  const satelitePosition = new THREE.Vector3();

  sateliteOrbit.updateMatrixWorld(true);
  sateliteOrbit.getWorldPosition(satelitePosition);
  planarMaterial.uniforms.uPoint.value.copy(satelitePosition);


  const deltaTime = clock.getDelta();
  launchAngle += 0.5 * deltaTime;

sateliteOrbit.position.x =
    Math.cos(launchAngle) * orbitRadius;

sateliteOrbit.position.y =
    Math.sin(launchAngle) * orbitRadius;

sateliteOrbit.position.z = 0;
  renderer.render(scene, currCamera);

 
  orbitalCamera.getWorldDirection(direction);

  right.crossVectors(direction, orbitalCamera.up).normalize();
  if (wDown == true) {
    orbitalCamera.position.addScaledVector(direction, 25 * deltaTime);
  }
  if (sDown == true) {
    orbitalCamera.position.addScaledVector(direction, -25 * deltaTime);
  }
  if (aDown == true) {
    orbitalCamera.position.addScaledVector(right, -25 * deltaTime);
  }
  if (dDown == true) {
    orbitalCamera.position.addScaledVector(right, 25 * deltaTime);
  }
  if (leftDown == true) {
    orbitalCamera.rotation.y += 0.5* deltaTime;
  }
  if (rightDown == true) {
    orbitalCamera.rotation.y -= 0.5* deltaTime;
  }
  if (upDown == true) {
    orbitalCamera.rotation.x += 0.5* deltaTime;
  }
  if (downDown == true) {
    orbitalCamera.rotation.x -= 0.5* deltaTime;
  }
  
}
animate();

    </script>
</body>
</html>
